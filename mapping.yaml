# Tessl 2x3 + 1 knob (no layer switch)
# Dictation = ⌃⇧D (matches macOS System Settings → Keyboard → Dictation)
model: ch57x-2
orientation: normal
rows: 2
columns: 3
knobs: 1

layers:
  - buttons:
      # top: cancel | select-all+clear | accept/submit
      - ["escape", "cmd-a,backspace", "cmd-enter"]
      # bottom: screenshot | paste | native Dictation
      - ["cmd-shift-4", "cmd-v", "ctrl-shift-d"]
    knobs:
      - ccw: "cmd-z"
        press: "play"
        cw: "cmd-shift-z"
